name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Gradle/detekt run on 24; the Java toolchain still compiles against 25
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            25
            24
          cache: gradle
      - name: Grant Gradle wrapper
        run: chmod +x gradlew
      - name: Build and test
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_24_X64 }}
        run: ./gradlew check --no-daemon
