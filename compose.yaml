services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: bibliothek
      POSTGRES_USER: bibliothek
      POSTGRES_PASSWORD: bibliothek
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bibliothek -d bibliothek"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: bibliothek
      RABBITMQ_DEFAULT_PASS: bibliothek
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
