spring:
  application:
    name: samliothek
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/${POSTGRES_DB:samliothek}}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:samliothek}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:samliothek}}
  flyway:
    enabled: true
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: false
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:samliothek}
    password: ${SPRING_RABBITMQ_PASSWORD:samliothek}
  docker:
    compose:
      lifecycle-management: start_and_stop
      skip:
        in-tests: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# Open API — no authentication / authorisation (deliberate; see PROJECT.md §1)
