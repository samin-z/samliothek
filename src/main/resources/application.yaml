spring:
  application:
    name: samliothek
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/samliothek
    username: samliothek
    password: samliothek
  flyway:
    enabled: true
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: false
  rabbitmq:
    host: localhost
    port: 5672
    username: samliothek
    password: samliothek
  docker:
    compose:
      lifecycle-management: start_and_stop
      skip:
        in-tests: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# Open API — no authentication / authorisation (deliberate; see PROJECT.md §1)
